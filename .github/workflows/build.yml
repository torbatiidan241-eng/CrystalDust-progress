name: Build GBA ROM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev pkg-config libz-dev

      - name: Build Tools
        run: |
          for dir in tools/*/; do
            if [ -f "${dir}Makefile" ]; then
              make -C "$dir" CC=gcc CXX=g++
            fi
          done

      - name: Build ROM
        run: |
          export PATH=$PATH:$(pwd)/tools
          
          # Force the Makefile to use the correct ARM cross-compiler
          # This replaces 'CC := gcc' or similar with 'CC := arm-none-eabi-gcc'
          sed -i 's/CC :=.*/CC := arm-none-eabi-gcc/' Makefile
          sed -i 's/AS :=.*/AS := arm-none-eabi-as/' Makefile
          sed -i 's/LD :=.*/LD := arm-none-eabi-ld/' Makefile
          sed -i 's/OBJCOPY :=.*/OBJCOPY := arm-none-eabi-objcopy/' Makefile
          
          make clean
          make -j$(nproc)
        
      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rom-artifact
          path: "*.gba"
