name: Build GBA ROM

on:
  push:
    branches:
      - progress
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # This ensures all steps run inside your project folder automatically
    defaults:
      run:
        working-directory: CrystalDust-progress

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        # Install latest ARM toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libpng-dev \
            pkg-config

      - name: Clean build
        run: make clean

      - name: Build tools
        run: make tools

      - name: Build ROM
        run: make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rom-artifact
          # Adjust this path if the .gba file is in a subfolder
          path: CrystalDust-progress/*.gba
