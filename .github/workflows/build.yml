name: Build GBA ROM

on:
  push:
    branches:
      - main
      - progrees
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev pkg-config libz-dev

      - name: Verify Environment
        run: |
          # This step will stop the build immediately if the compiler is missing
          if [ ! -f "tools/agbcc/agbcc" ]; then
            echo "ERROR: 'tools/agbcc/agbcc' binary is missing from your repository!"
            echo "You must upload the agbcc executable to your tools/agbcc/ folder."
            exit 1
          fi
          mkdir -p tools/agbcc/bin
          cp tools/agbcc/agbcc tools/agbcc/bin/agbcc
          chmod +x tools/agbcc/bin/agbcc

      - name: Build ROM
        run: |
          export PATH="$(pwd)/tools:$PATH"
          make clean
          make -j$(nproc) CC=arm-none-eabi-gcc \
                        CXX=arm-none-eabi-g++ \
                        AS=arm-none-eabi-as \
                        LD=arm-none-eabi-ld \
                        OBJCOPY=arm-none-eabi-objcopy \
                        CPPFLAGS="-Iinclude"
        
      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rom-artifact
          path: "*.gba"
