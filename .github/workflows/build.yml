name: Build CrystalDust

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies & Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget build-essential python3 unzip make libpng-dev libz-dev gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Fix missing cstdint in all json11.cpp files
        run: |
          find . -name "json11.cpp" | while read file; do
            echo "Patching $file"
            sed -i '1i #include <cstdint>' "$file"
          done

      - name: Download and Install Official Poryscript Binary
        run: |
          mkdir -p tools/poryscript
          wget -q https://github.com/huderlem/poryscript/releases/latest/download/poryscript-linux.zip -O poryscript-linux.zip
          unzip -o poryscript-linux.zip -d tools/poryscript/
          # Move files out of the nested folder if they extracted into poryscript-linux/
          if [ -d "tools/poryscript/poryscript-linux" ]; then
            cp -r tools/poryscript/poryscript-linux/* tools/poryscript/
            rm -rf tools/poryscript/poryscript-linux
          fi
          chmod +x tools/poryscript/poryscript
          rm poryscript-linux.zip

      - name: Clone, Build, and Install agbcc
        run: |
          mkdir -p tools/agbcc
          if [ ! -f "tools/agbcc/build.sh" ]; then
            rm -rf tools/agbcc
            git clone https://github.com/pret/agbcc tools/agbcc
          fi
          
          cd tools/agbcc
          ./build.sh
          ./install.sh ../../
          cd ../..
          make tools

      - name: Run Sequential Modern Build
        run: |
          export CC=arm-none-eabi-gcc
          make modern

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: gba-rom
          path: |
            *.gba
            build/*.gba
