name: Build GBA ROM

on:
  push:
    branches:
      - progress
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libpng-dev \
            pkg-config \
            libz-dev

      - name: Clean build
        run: make clean

      - name: Build tools
        # We explicitly build the tools and list them to ensure they exist
        run: |
          make tools
          ls -l tools/scaninc/scaninc
          ls -l tools/ramscrgen/ramscrgen

      - name: Build ROM
        run: make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rom-artifact
          path: "*.gba"
