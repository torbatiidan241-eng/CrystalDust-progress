name: Build CrystalDust

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            unzip \
            git \
            python3 \
            libpng-dev \
            zlib1g-dev \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Setup Poryscript
        run: |
          mkdir -p tools/poryscript
          wget -q https://github.com/huderlem/poryscript/releases/latest/download/poryscript-linux.zip -O poryscript.zip
          unzip -q -o poryscript.zip -d tools/poryscript
          if [ -d "tools/poryscript/poryscript-linux" ]; then
            mv tools/poryscript/poryscript-linux/* tools/poryscript/
            rm -rf tools/poryscript/poryscript-linux
          fi
          chmod +x tools/poryscript/poryscript
          rm poryscript.zip

      - name: Build and Install agbcc
        run: |
          rm -rf tools/agbcc
          git clone --depth=1 https://github.com/pret/agbcc.git tools/agbcc
          cd tools/agbcc
          ./build.sh
          ./install.sh ../..
          cd ../..

      - name: Build Project Tools
        run: make tools

      - name: Build ROM
        run: make modern -j$(nproc)

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: |
            CrystalDust.gba
            *.gba
          if-no-files-found: error
