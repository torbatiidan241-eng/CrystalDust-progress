name: Build GBA ROM

on:
  push:
    branches:
      - progress
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libpng-dev \
            pkg-config \
            libz-dev

      - name: Clean environment
        run: make clean

      - name: Build tools
        run: |
          make tools
          # Verify tools exist after build
          if [ ! -f "tools/scaninc/scaninc" ]; then echo "scaninc missing"; exit 1; fi
          if [ ! -f "tools/ramscrgen/ramscrgen" ]; then echo "ramscrgen missing"; exit 1; fi

      - name: Build ROM
        run: make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rom-artifact
          path: "*.gba"
