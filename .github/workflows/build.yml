name: Build GBA ROM

on:
  push:
    branches:
      - main
      - progrees
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev pkg-config libz-dev

      - name: Build Tools
        run: |
          for dir in tools/*/; do
            if [ -f "${dir}Makefile" ]; then
              make -C "$dir" CC=gcc CXX=g++
            fi
          done

      - name: Build ROM
        run: |
          export PATH=$PATH:$(pwd)/tools
          
          # We define ARM_INC to locate compiler-specific headers
          ARM_INC=$(arm-none-eabi-gcc -print-file-name=include)
          
          make clean
          # Added -ffreestanding to prevent searching for host system headers
          make -j$(nproc) TOOLCHAIN=arm-none-eabi- \
                        CPPFLAGS="-Iinclude -I$ARM_INC -ffreestanding" \
                        CC=arm-none-eabi-gcc \
                        CXX=arm-none-eabi-g++ \
                        AS=arm-none-eabi-as \
                        LD=arm-none-eabi-ld \
                        OBJCOPY=arm-none-eabi-objcopy
        
      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rom-artifact
          path: "*.gba"
