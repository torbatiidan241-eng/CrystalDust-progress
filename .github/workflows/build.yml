name: Build GBA ROM

on:
  push:
    branches:
      - progress
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libpng-dev \
            pkg-config \
            libz-dev

      - name: Build tools manually
        run: |
          # Manually compile tools to bypass faulty Makefile logic
          gcc tools/scaninc/scaninc.c -o tools/scaninc/scaninc
          gcc tools/ramscrgen/ramscrgen.c -o tools/ramscrgen/ramscrgen
          gcc tools/preproc/preproc.c -o tools/preproc/preproc
          
          # Ensure they are executable
          chmod +x tools/scaninc/scaninc
          chmod +x tools/ramscrgen/ramscrgen
          chmod +x tools/preproc/preproc

      - name: Build ROM
        run: make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rom-artifact
          path: "*.gba"
