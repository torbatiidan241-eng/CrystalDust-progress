name: Build GBA ROM

on:
  push:
    branches:
      - main
      - progrees
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Force Node.js 24 to resolve the deprecation warning
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Ensure both compiler and C library for ARM are installed
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev pkg-config libz-dev

      - name: Build Tools
        run: |
          for dir in tools/*/; do
            if [ -f "${dir}Makefile" ]; then
              make -C "$dir" CC=gcc CXX=g++
            fi
          done

      - name: Build ROM
        run: |
          # Add tools to path
          export PATH=$PATH:$(pwd)/tools
          
          # Build ROM with explicit toolchain prefix and include headers
          # TOOLCHAIN=arm-none-eabi- is the standard way for GBA projects
          make clean
          make -j$(nproc) TOOLCHAIN=arm-none-eabi- CPPFLAGS="-Iinclude"
        
      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rom-artifact
          path: "*.gba"
