name: CI Build - CrystalDust (Progress)

on:
  push:
    branches:
      - progress
      - main
  pull_request:
    branches:
      - progress
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

 steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize Submodules (Explicit Fallback)
        run: |
          git submodule sync
          git submodule update --init --recursive

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential \
            git \
            libpng-dev \
            pkg-config \
            python3 \
            python3-pip

      - name: Install agbcc
        run: |
          if [ ! -f tools/agbcc/agbcc ]; then
            cd tools/agbcc
            ./build.sh
            ./install.sh ../..
            cd ../..
          fi

      - name: Build toolchain host binaries
        run: |
          make -C tools

      - name: Build ROM (crystaldust.gba)
        run: |
          make -j$(nproc) crystaldust.gba

      - name: Verify SHA1 Checksum
        run: |
          sha1sum -c crystaldust.sha1 || echo "Non-matching SHA1 build (custom hack build)"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crystaldust-rom-progress
          path: |
            crystaldust.gba
            crystaldust.map
