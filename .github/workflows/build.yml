name: Build GBA ROM

on:
  push:
    branches:
      - main
      - progrees
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev pkg-config libz-dev

      - name: Build Tools
        run: |
          # Build tools using system gcc
          for dir in tools/*/; do
            if [ -f "${dir}Makefile" ]; then
              make -C "$dir" CC=gcc CXX=g++
            fi
          done

      - name: Build ROM
        run: |
          # Add tools to path
          export PATH=$PATH:$(pwd)/tools
          
          # We use variable overrides to force the ARM toolchain.
          # We also set CPPFLAGS to ensure the compiler finds headers.
          make clean
          make -j$(nproc) CC=arm-none-eabi-gcc \
                        CXX=arm-none-eabi-g++ \
                        AS=arm-none-eabi-as \
                        LD=arm-none-eabi-ld \
                        OBJCOPY=arm-none-eabi-objcopy \
                        CPPFLAGS="-Iinclude"
        
      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rom-artifact
          path: "*.gba"
