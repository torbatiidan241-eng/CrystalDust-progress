name: CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/pret/pokeemerald:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: make -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          path: *.gba